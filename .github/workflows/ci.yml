name: CI / Automated Tests

on:
  push:
    branches: [ "inicio 12", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Subindo um container PostgreSQL para os testes integrados, caso precisem de banco.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Dar permissão de execução ao Maven Wrapper
      run: chmod +x mvnw

    - name: Executar os Testes
      run: ./mvnw clean test
      env:
        DB_URL: jdbc:postgresql://localhost:5432/taskflow_db
        DB_USER: root
        DB_PASSWORD: password
        JWT_SECRET: chavesecretaparaostestes

  deploy:
    name: Deploy na Máquina em Nuvem
    needs: build-and-test # Isso garante que o deploy SÓ ACONTEÇA se os testes passarem!
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' # Executa deploy apenas na branch principal

    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Navega até a pasta do projeto no servidor (Altere este caminho se necessário)
            cd /caminho/para/sua/pasta/taskflow-backend-api
            
            # 2. Puxa as últimas alterações do GitHub
            git pull origin main
            
            # 3. Recria os containers Docker com o código novo (sem derrubar o banco, se configurado corretamente)
            docker-compose up -d --build api

