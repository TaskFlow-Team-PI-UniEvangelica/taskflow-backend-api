name: CI/CD Backend

on:
  push:
    branches: [main, master, homol]
  pull_request:
    branches: [main, master, homol]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    # Os testes de integração sobem o próprio PostgreSQL via Testcontainers (Docker do runner)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: chmod +x mvnw && ./mvnw -B clean verify

  images:
    name: Build & Push Imagens ARM64
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Escaneia e reporta todas as imagens mesmo se uma for reprovada pelo Trivy
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: keycloak
            context: keycloak
            file: keycloak/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # As imagens são só linux/arm64 (servidor Oracle); sem TRIVY_PLATFORM o Trivy procura a
      # variante amd64 do runner, não encontra e falha (o deploy da main nunca chegava a rodar).
      - name: Trivy - bloqueia vulnerabilidades CRITICAL com correção disponível
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskflow-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Trivy - relatório de vulnerabilidades HIGH (não bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskflow-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'
          output: trivy-high.txt
          skip-setup-trivy: true
      - name: Publica o relatório HIGH no resumo do job
        if: always()
        run: |
          echo "### Trivy (HIGH) - taskflow-${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-high.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "relatório indisponível" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy na Oracle Cloud
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Envia compose e scripts para o servidor
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          source: "deploy/docker-compose.prod.yml,deploy/scripts/*"
          target: /srv/taskflow/.incoming
      - name: Executa deploy com verificação de saúde e rollback
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -e
            cd /srv/taskflow
            cp .incoming/deploy/docker-compose.prod.yml docker-compose.yml
            cp .incoming/deploy/scripts/*.sh scripts/ && chmod 700 scripts/*.sh
            cp .incoming/deploy/scripts/*.sql scripts/ && chmod 600 scripts/*.sql
            rm -rf .incoming
            ./scripts/deploy.sh backend ${{ github.sha }}
