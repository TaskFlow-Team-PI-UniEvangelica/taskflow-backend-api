# Profile dos testes de integração (Testcontainers).
# A conexão real com o PostgreSQL vem do @ServiceConnection do container; estes valores só
# preenchem os placeholders obrigatórios do application.properties e não são usados para conectar.
DB_URL=jdbc:postgresql://definido-pelo-testcontainers/ignorado
DB_USER=ignorado
DB_PASSWORD=ignorado

# Não grava no spring-error.log da raiz do projeto (usado pela API rodando na IDE)
logging.file.name=target/integration-tests.log
logging.level.web=INFO

# Espelha o perfil prod para detectar LazyInitializationException fora de transações
spring.jpa.open-in-view=false
