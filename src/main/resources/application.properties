spring.application.name=api-taskflow

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

api.cors.frontend.url=${FRONTEND_URL:http://localhost}
api.cors.frontend.url.vite=${FRONTEND_URL_VITE:http://localhost:5173}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOACK_URL_VITE:http://localhost:9090/realms/taskflow-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:9090/realms/taskflow-realm/protocol/openid-connect/certs}

# Limite de upload do avatar (o frontend envia o recorte reduzido para no maximo 512x512 JPEG)
# A requisicao tem folga para os metadados do multipart; acima do limite a API responde 413.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Log to file for debugging
logging.file.name=spring-error.log
logging.level.web=DEBUG

# Swagger UI OAuth2 Config
springdoc.swagger-ui.oauth.clientId=taskflow-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true


# Mail setup
# Padrao: Mailpit publicado no host (API rodando na IDE). Dentro do Docker, usar SMTP_HOST=mailpit.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# O envio de e-mail nao e essencial para a API atender requisicoes: o health nao deve
# depender do SMTP (evita DOWN em dev e rollback indevido no deploy por instabilidade do SMTP).
management.health.mail.enabled=false

# FreeMarker setup
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl

# Expurgo agendado do historico de tarefas excluidas fora da retencao (RNE-006)
# Cron do Spring (seg min hora dia mes dia-semana), fuso America/Sao_Paulo. Padrao: todo dia as 03:00.
app.history.purge-cron=${HISTORY_PURGE_CRON:0 0 3 * * *}
