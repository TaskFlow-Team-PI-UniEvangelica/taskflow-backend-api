spring.application.name=api-taskflow

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

api.cors.frontend.url=${FRONTEND_URL:http://localhost}
api.cors.frontend.url.vite=${FRONTEND_URL_VITE:http://localhost:5173}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOACK_URL_VITE:http://localhost:9090/realms/taskflow-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/taskflow-realm/protocol/openid-connect/certs}

# Aumentando limite de upload para o Avatar
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Log to file for debugging
logging.file.name=spring-error.log
logging.level.web=DEBUG

# Swagger UI OAuth2 Config
springdoc.swagger-ui.oauth.clientId=taskflow-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true


# Mail setup
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# FreeMarker setup
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
