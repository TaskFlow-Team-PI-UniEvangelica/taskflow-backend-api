# ==========================================
# TaskFlow API - Configurações de Produção
# Ativado via SPRING_PROFILES_ACTIVE=prod
# ==========================================

# Logs limpos no stdout (gerenciados e rotacionados pelo daemon Docker)
logging.file.name=
logging.level.root=INFO
logging.level.web=INFO
logging.level.unievangelica.taskflow=INFO

# Swagger UI desativado em produção por segurança
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Banco de Dados: Validação estrita do schema e proteção contra comandos de limpeza
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true

# Tratamento de Erros: Nenhum stacktrace ou mensagem sensível vazada para clientes
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# Actuator: Somente healthcheck exposto sem detalhes internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SMTP Produção (OCI Email Delivery ou relay compatível)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${SMTP_FROM:nao-responda@taskflow.party}
